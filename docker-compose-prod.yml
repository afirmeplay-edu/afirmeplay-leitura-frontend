services:
  web:
    container_name: afirme-ler-prod
    image: afirmeplay/afirme-ler:v${VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Embutidas no bundle no build — ajuste para a URL real da API
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
        NEXT_PUBLIC_DEBUG_MODE: ${NEXT_PUBLIC_DEBUG_MODE:-false}
    environment:
      # NEXT_PUBLIC_* já vai no build; repetir no runtime cobre process.env no servidor
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5000}
      NEXT_PUBLIC_DEBUG_MODE: ${NEXT_PUBLIC_DEBUG_MODE:-false}
      # Variáveis só de servidor: podem mudar sem rebuild
      API_DISCOVERY_REMOTE_URL: ${API_DISCOVERY_REMOTE_URL:-https://prod-api.afirmeplay.com.br}
      CITIES_DATABASE_URL: ${CITIES_DATABASE_URL:-}
      CITIES_DISCOVERY_REGISTRATION: ${CITIES_DISCOVERY_REGISTRATION:-}
      CITIES_DISCOVERY_PASSWORD: ${CITIES_DISCOVERY_PASSWORD:-}
    networks:
      - afirmeplay_network_prod
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: afirme-ler-nginx-prod
    ports:
      - "8002:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - afirmeplay_network_prod
    depends_on:
      - web

networks:
  afirmeplay_network_prod:
    name: afirmeplay_network_prod
    external: true